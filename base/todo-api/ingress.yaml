apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: todo-api
spec:
  ingressClassName: nginx
  rules:
    - host: api.todo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: todo-api
                port:
                  number: 8010