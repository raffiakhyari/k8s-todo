apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/todo-api

images:
  - name: todo-api
    newName: raffiakhyari/todo-api
    newTag: "0"

patches:
  - target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: todo-api
    path: ingress-patch.yaml

  - path: configmap-patch.yaml