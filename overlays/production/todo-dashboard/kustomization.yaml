apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/todo-dashboard

images:
  - name: todo-dashboard
    newName: raffiakhyari/todo-dashboard
    newTag: "0"

patches:
  - target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: todo-dashboard
    path: ingress-patch.yaml